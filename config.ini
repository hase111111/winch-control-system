# Winch Control System Configuration File
# This is an INI-format configuration file

# シリアルポート設定
[Serial]
port = /dev/ttyUSB0

# UDP設定
[UDP]
port = 5005

# CAN設定
[CAN]
interface = can0

# PD制御パラメータ
[PDControl]

# モータ1
motor1_kp = 1.0
motor1_kd = 0.1

# モータ2
motor2_kp = 1.2
motor2_kd = 0.15

# 補償する重力値 [単位: kg]
gravity_compensation_kg = 10

# ポテンショメータ
[Potentiometer]

# ポテンショメータ0のオフセット値[単位: degrees]
offset0 = 0.0
offset1 = 0.0

# フラグ設定
[Flags]
enable_serial = false
enable_udp = true
enable_can = false
move_morotors = false

# CSV出力先設定
[CSV]
output_directory = ./data_logs
